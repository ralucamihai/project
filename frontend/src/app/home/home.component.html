<div class="hero-section">
  <div class="user-info">
    <span class="username">{{currentUser.username}}</span>
    <span class="role">{{currentUser.role}}</span>
  </div>

  <div class="hero-content">
    <div class="text-content">
      <h1 class="hero-title">
        Bună!<br>
        Bine ai revenit!<br>
      </h1>
      <div class="button-group">
        <!-- <button class="btn-custom" (click)="goToForgotPassword()">Uitat parolă</button> -->
        <!-- <button class="btn-custom" (click)="goToAccountManagement()">Administrare cont</button> -->
        <button class="btn-custom" (click)="openGuide()">Ghid</button>
        <button *ngIf="isAdmin()" class="btn-custom btn-admin" (click)="openEditGuide()">Editare ghid</button>
        <button class="btn-custom btn-logout" (click)="logout()">Deconectare</button>
      </div>
    </div>
    <!-- Containerul gol pentru imagine a fost eliminat de aici -->
  </div>
  <div class="bg-decoration bg-decoration-1"></div>
  <div class="bg-decoration bg-decoration-2"></div>
  <div class="bg-decoration bg-decoration-3"></div>
</div>

<!-- <button class="feedback-button" (click)="openReportProblem()">
  Ai găsit o problemă? Raportează aici!
</button> -->

<div *ngIf="showGuide" class="guide-modal-overlay" (click)="closeGuide()">
  <div class="guide-modal" (click)="$event.stopPropagation()">
    <h2>Ghid</h2>
    <div *ngIf="guideText; else loadingTemplate" [innerHTML]="guideText"></div>
    <ng-template #loadingTemplate>
      <p>Ghidul se încarcă...</p>
    </ng-template>
    <button (click)="closeGuide()">Închide</button>
  </div>
</div>

<div *ngIf="showEditGuide" class="guide-modal-overlay" (click)="closeEditGuide()">
  <div class="guide-modal edit-modal" (click)="$event.stopPropagation()">
    <h2>Editare ghid</h2>
    <div class="edit-guide-content">
      <p class="edit-info">
        <strong>Variabile disponibile:</strong><br>
        <span ngNonBindable>{{role}}</span> - va fi înlocuit cu rolul utilizatorului<br>
        <span ngNonBindable>{{username}}</span> - va fi înlocuit cu numele utilizatorului<br>
      </p>

      <div class="edit-container">
        <div class="edit-section">
          <h3>Editor</h3>
          <textarea [(ngModel)]="editableGuideText" (input)="onTextInput($event)"
            placeholder="Introduceți textul ghidului..." class="guide-textarea" [disabled]="isLoading">
          </textarea>
        </div>

        <div class="preview-section">
          <h3>Preview</h3>
          <div class="preview-content" [innerHTML]="getPreviewText()"></div>
        </div>
      </div>

      <div class="edit-buttons">
        <button (click)="saveGuideText()" class="btn-save" [disabled]="isLoading">
          {{isLoading ? 'Se salvează...' : 'Salvează'}}
        </button>
        <button (click)="closeEditGuide()" [disabled]="isLoading">Anulează</button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="reportProblemVisible" class="guide-modal-overlay" (click)="closeReportProblem()">
  <div class="guide-modal" (click)="$event.stopPropagation()">
    <h2>Raportează o problemă!</h2>
    <textarea [(ngModel)]="problemDescription" placeholder="Descrie problema..." rows="5"></textarea>
    <input type="email" [(ngModel)]="userEmail" placeholder="Emailul tău" />
    <button (click)="submitReport()">Trimite</button>
    <button (click)="closeReportProblem()">Închide</button>
  </div>
</div>
